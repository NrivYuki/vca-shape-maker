name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: vca-shape-maker
      # 穴(DRILLE)を vca-guide のパーサーで読み直すテストと、義務の番号の照合に使う
      - uses: actions/checkout@v4
        with:
          repository: NrivYuki/vca-guide
          path: vca-guide
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: vca-shape-maker
      # 規格との対応の表にテストがあり、docs/conformance-tests.md が古くないこと
      - run: node tools/trace.js --check
        working-directory: vca-shape-maker
